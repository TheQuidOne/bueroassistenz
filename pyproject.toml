[project]
name = "arbeitsassistent"
version = "0.1.0"
description = "Lokale Buchhaltungs- und Arbeitsübersicht für Selbstständige"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "fpdf2>=2.8",
    "segno>=1.6",
    "keyring>=25",
    "truststore>=0.10",
    "drafthorse>=2025.2",
    "pillow>=10.4",  # Farbprofil für PDF/A, Unterschrift aufbereiten
    "pypdf>=5",  # eingescannte Unterschrift aus PDF lesen
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
arbeitsassistent = "arbeitsassistent.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arbeitsassistent*"]

[tool.setuptools.package-data]
arbeitsassistent = ["templates/*.html", "static/*.css", "static/hilfe/*", "schriften/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
